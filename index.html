<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jardinier vs Eucalyptus</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(#87ceeb, #e0f7fa);
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 { margin: 8px 0 2px; color: #2e7d32; text-shadow: 1px 1px 0 #fff; font-size: 22px; text-align: center; }
  #hud { font-size: 16px; color: #33691e; margin-bottom: 6px; }
  @media (max-width: 500px) {
    body { padding: 0 6px; }
    h1 { font-size: 18px; }
    #msg { font-size: 13px; }
  }
  #game {
    border: 4px solid #5d4037;
    border-radius: 8px;
    background: #a5d6a7;
    display: block;
    width: 100%;
    max-width: 640px;
    height: auto;
    touch-action: none;
  }
  #msg {
    margin-top: 10px; font-size: 16px; color: #5d4037; text-align: center;
  }
  button {
    margin-top: 8px; padding: 8px 16px; font-size: 16px; cursor: pointer;
    background: #66bb6a; color: white; border: none; border-radius: 6px;
  }
  button:hover { background: #43a047; }
</style>
</head>
<body>
<h1>🌱 Jardinier vs Eucalyptus 🌿</h1>
<div id="hud">Score : <span id="score">0</span> — Meilleur : <span id="best">0</span></div>
<canvas id="game" width="640" height="480"></canvas>
<button id="restart" style="display:none">Rejouer</button>
<div id="msg">📱 Touche la moitié gauche/droite de l'écran pour bouger · ⌨️ ← → ou Q/D · Évite les branches ! 🌿</div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const msgEl = document.getElementById("msg");
const restartBtn = document.getElementById("restart");

const GROUND = H - 50;
const gardener = { x: W / 2, y: GROUND, w: 34, h: 56, speed: 5.5, dir: 0 };
let branches = [];
let score = 0;
let best = Number(localStorage.getItem("jardinier-best") || 0);
let running = true;
let spawnTimer = 0;
const keys = {};

bestEl.textContent = best;

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

const pointers = new Map();
function touchDir() {
  const r = canvas.getBoundingClientRect();
  let dir = 0;
  for (const x of pointers.values()) dir += x - r.left < r.width / 2 ? -1 : 1;
  return Math.sign(dir);
}
canvas.addEventListener("pointerdown", e => { pointers.set(e.pointerId, e.clientX); e.preventDefault(); });
canvas.addEventListener("pointermove", e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX); });
const releasePointer = e => { pointers.delete(e.pointerId); };
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("pointerleave", releasePointer);
restartBtn.addEventListener("click", reset);

function reset() {
  branches = [];
  score = 0;
  spawnTimer = 0;
  gardener.x = W / 2;
  running = true;
  restartBtn.style.display = "none";
  msgEl.textContent = "📱 Touche la moitié gauche/droite de l'écran pour bouger · ⌨️ ← → ou Q/D · Évite les branches ! 🌿";
}

function spawnBranch() {
  const len = 40 + Math.random() * 50;
  // Feuilles en faucille, alternes, retombantes : générées une fois par branche
  // pour que le graphisme reste stable d'une frame à l'autre.
  const n = 7 + Math.floor(Math.random() * 3);
  const leaves = [];
  for (let i = 0; i < n; i++) {
    leaves.push({
      t: 0.15 + 0.8 * (i / Math.max(1, n - 1)), // position le long de la branche
      side: i % 2 === 0 ? -1 : 1,               // feuillage alterne
      angle: 0.45 + Math.random() * 0.55,       // port retombant
      len: 17 + Math.random() * 9,
      curve: (Math.random() - 0.5) * 7,         // légère courbure en faucille
      tone: Math.floor(Math.random() * 4),
      tilt: (Math.random() - 0.5) * 0.35
    });
  }
  branches.push({
    x: 20 + Math.random() * (W - 40),
    y: -40,
    len,
    leaves,
    angle: Math.random() * Math.PI,
    spin: (Math.random() - 0.5) * 0.1,
    speed: 2.2 + Math.random() * 2.2 + Math.min(score / 300, 3)
  });
}

function update() {
  if (!running) return;
  gardener.dir = touchDir();
  if (keys["ArrowLeft"] || keys["q"] || keys["Q"]) gardener.dir -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) gardener.dir += 1;
  gardener.dir = Math.sign(gardener.dir);
  gardener.x = Math.max(gardener.w / 2, Math.min(W - gardener.w / 2, gardener.x + gardener.dir * gardener.speed));

  spawnTimer -= 1;
  if (spawnTimer <= 0) {
    spawnBranch();
    spawnTimer = Math.max(18, 60 - score / 20);
  }

  for (const b of branches) {
    b.y += b.speed;
    b.angle += b.spin;
    const dx = Math.abs(b.x - gardener.x);
    const dy = Math.abs(b.y - gardener.y + gardener.h / 2);
    if (dx < b.len / 2 + gardener.w / 2 - 6 && dy < 8 + gardener.h / 2 - 6) {
      running = false;
      if (score > best) {
        best = score;
        localStorage.setItem("jardinier-best", best);
        bestEl.textContent = best;
      }
      msgEl.textContent = "Aïe ! Une branche t'a cogné la tête 🤕 — Score final : " + score;
      restartBtn.style.display = "block";
    }
  }
  branches = branches.filter(b => b.y < H + 60);
  score += 1;
  scoreEl.textContent = score;
}

function drawGardener() {
  const { x, y, w, h } = gardener;
  ctx.save();
  ctx.translate(x, y);
  // jambes
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(-w / 2 + 4, -10, 10, 12);
  ctx.fillRect(w / 2 - 14, -10, 10, 12);
  // corps (blouse de jardinage)
  ctx.fillStyle = "#7cb342";
  ctx.fillRect(-w / 2 + 2, -h + 18, w - 4, h - 30);
  // tête
  ctx.fillStyle = "#ffcc80";
  ctx.beginPath();
  ctx.arc(0, -h + 8, 11, 0, Math.PI * 2);
  ctx.fill();
  // chapeau de paille
  ctx.fillStyle = "#d4a95c";
  ctx.fillRect(-14, -h + 2, 28, 5);
  ctx.fillRect(-9, -h - 3, 18, 5);
  // yeux
  ctx.fillStyle = "#333";
  ctx.fillRect(-4, -h + 8, 2, 2);
  ctx.fillRect(2, -h + 8, 2, 2);
  // bras tendus (panique !)
  ctx.fillStyle = "#ffcc80";
  ctx.fillRect(-w / 2 - 6, -h + 24, 8, 4);
  ctx.fillRect(w / 2 - 2, -h + 24, 8, 4);
  ctx.restore();
}

// Une feuille d'eucalyptus : lame allongée en faucille, nervure centrale
// claire (effet pruine), pétiole court.
function drawEucalyptusLeaf(L, curve, tone) {
  const tones = ["#7d9c7f", "#8fac8e", "#6d8f74", "#9db69b"];
  const Wd = L * 0.22;
  // pétiole court
  ctx.strokeStyle = "#7a5c50";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(L * 0.14, curve * 0.2);
  ctx.stroke();
  // lame en faucille
  ctx.beginPath();
  ctx.moveTo(L * 0.12, curve * 0.2);
  ctx.quadraticCurveTo(L * 0.5, -Wd + curve * 0.4, L, curve);
  ctx.quadraticCurveTo(L * 0.5, Wd * 0.7 + curve * 0.4, L * 0.12, curve * 0.2);
  ctx.closePath();
  ctx.fillStyle = tones[tone % tones.length];
  ctx.fill();
  ctx.strokeStyle = "rgba(50,70,55,0.35)";
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // nervure centrale claire
  ctx.strokeStyle = "rgba(226,236,220,0.75)";
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(L * 0.16, curve * 0.25);
  ctx.quadraticCurveTo(L * 0.55, -Wd * 0.35 + curve * 0.45, L * 0.94, curve * 0.9);
  ctx.stroke();
}

function drawBranch(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  const half = b.len / 2;
  ctx.lineCap = "round";

  // bois interne brun rougeâtre (visible où l'écorce pèle)
  ctx.strokeStyle = "#8a5a44";
  ctx.lineWidth = 6.5;
  ctx.beginPath();
  ctx.moveTo(-half, 0);
  ctx.lineTo(half, 0);
  ctx.stroke();

  // écorce extérieure grisée, par plaques détachées
  ctx.strokeStyle = "#9e948d";
  ctx.lineWidth = 5;
  for (let i = 0; i < 4; i++) {
    const x0 = -half + b.len * (i * 0.22 + 0.05);
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(x0 + b.len * 0.14, 0);
    ctx.stroke();
  }

  // fibres longitudinales sombres
  ctx.strokeStyle = "rgba(62,39,35,0.55)";
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const x = -half + b.len * (i * 0.19 + 0.06);
    ctx.beginPath();
    ctx.moveTo(x, -1.6);
    ctx.lineTo(x + b.len * 0.06, 1.4);
    ctx.stroke();
  }

  // feuilles alternes, retombantes, en faucille
  for (const lf of b.leaves) {
    ctx.save();
    ctx.translate(-half + b.len * lf.t, 0);
    ctx.rotate(lf.side * lf.angle + lf.tilt);
    drawEucalyptusLeaf(lf.len, lf.curve, lf.tone);
    ctx.restore();
  }
  ctx.restore();
}

function drawTouchHint() {
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  const y = GROUND + 34;
  ctx.beginPath();
  ctx.moveTo(30, y - 12); ctx.lineTo(30, y + 12); ctx.lineTo(48, y); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W - 30, y - 12); ctx.lineTo(W - 30, y + 12); ctx.lineTo(W - 48, y); ctx.closePath(); ctx.fill();
}

// Eucalyptus décoratif en fond : tronc à écorce qui pèle (plages brun
// rougeâtre sous une écorce grisée) et feuillage gris-vert discret.
function drawBackgroundEucalyptus(x, topY, w) {
  const h = GROUND + 10 - topY;
  ctx.fillStyle = "#9e948d";
  ctx.fillRect(x, topY, w, h);
  // stries verticales sombres
  ctx.fillStyle = "rgba(62,39,35,0.28)";
  ctx.fillRect(x + w * 0.3, topY, 1.5, h);
  ctx.fillRect(x + w * 0.62, topY + 8, 1.5, h - 8);
  // plaques d'écorce décollées laissant voir le brun rougeâtre
  ctx.fillStyle = "#8a5a44";
  for (let i = 0; i < 5; i++) {
    const py = topY + 18 + i * (h / 5.6);
    const px = x + (i % 2 === 0 ? -1 : w - 3);
    ctx.fillRect(px, py, 4, 12 + (i % 3) * 5);
  }
  // touffes de feuilles gris-vert en haut du tronc
  const tones = ["#7d9c7f", "#6d8f74", "#9db69b"];
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = tones[i % 3];
    ctx.beginPath();
    ctx.arc(x + w / 2 + Math.sin(i * 2.1) * 16, topY - 4 + (i % 3) * 7, 9 - (i % 2) * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // sol
  ctx.fillStyle = "#7cb342";
  ctx.fillRect(0, GROUND + 10, W, H - GROUND);
  // eucalyptus en fond
  drawBackgroundEucalyptus(30, 60, 14);
  drawBackgroundEucalyptus(W - 60, 90, 14);
  for (const b of branches) drawBranch(b);
  drawGardener();
  if (pointers.size > 0 || matchMedia("(pointer: coarse)").matches) drawTouchHint();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
