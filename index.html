<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jardinier vs Eucalyptus</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(#87ceeb, #e0f7fa);
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 { margin: 8px 0 2px; color: #2e7d32; text-shadow: 1px 1px 0 #fff; font-size: 26px; text-align: center; }
  #hud { font-size: 18px; color: #33691e; margin-bottom: 6px; }
  @media (max-width: 500px) {
    body { padding: 0 6px; }
    h1 { font-size: 18px; }
    #hud { font-size: 15px; }
    #msg { font-size: 13px; }
  }
  #game {
    border: 5px solid #5d4037;
    border-radius: 10px;
    background: #a5d6a7;
    display: block;
    width: 100%;
    max-width: 800px;
    height: auto;
    touch-action: none;
  }
  #msg {
    margin-top: 10px; font-size: 17px; color: #5d4037; text-align: center;
  }
  button {
    margin-top: 8px; padding: 8px 18px; font-size: 17px; cursor: pointer;
    background: #66bb6a; color: white; border: none; border-radius: 6px;
  }
  button:hover { background: #43a047; }
</style>
</head>
<body>
<h1>🌱 Jardinier vs Eucalyptus 🌿</h1>
<div id="hud">Score : <span id="score">0</span> — Meilleur : <span id="best">0</span></div>
<canvas id="game" width="800" height="600"></canvas>
<button id="restart" style="display:none">Rejouer</button>
<div id="msg">📱 Touche la moitié gauche/droite de l'écran pour bouger · ⌨️ ← → ou Q/D · Évite les branches ! 🌿</div>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const msgEl = document.getElementById("msg");
const restartBtn = document.getElementById("restart");

const GROUND = H - 50;
const gardener = { x: W / 2, y: GROUND, w: 34, h: 56, speed: 6, dir: 0 };
let branches = [];
let score = 0;
let best = Number(localStorage.getItem("jardinier-best") || 0);
let running = true;
let spawnTimer = 0;
const keys = {};

bestEl.textContent = best;

// Emblème du Domaine du Rayol (source : domainedurayol.org), imprimé sur le t-shirt.
// Usage personnel ; toute exploitation publique du logo requiert l'accord du Domaine.
const RAYOL_LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="52" height="53.2" viewBox="0 7 52 53.2" fill="#fff"><path d="M17.947 29.246c-.95.455-2.406 1.805-3.312 2.575.118-.176.405-.22.545-.235a12.3 12.3 0 0 0-1.553 2.29c-.257.197-.5.55-.596.88-.117.176-.257.198-.382.374-.074-2.539.86-4.857 2.42-6.735 1.443-1.732 1.892-1.856 1.98-1.98.236 1.598.839 1.606.89 2.83"/><path d="M18.683 19.352c-6.74 1.07-12.878 8.048-12.15 14.782.162 4.094 1.009 8.048 2.87 11.805 1.597 1.02 2.863 1.357 4.136 2.435a3 3 0 0 1-.648-.102c3.017 4.203 7.477 3.961 11.59 1.76.625-.47 2.95-.843 3.15-1.57-.074-.33-3.606-.308-5.439-.623-1.5-.396-2.994-.778-4.495-1.167-1.156-.455-2.046-1.306-3.201-1.76-1.56-.712-2.26-2.297-3.216-3.478-.552-.917-1.509-2.105-1.715-3.096-.42-1.98-.125-4.512.118-6.544.184-.697.375-1.401.56-2.098.507-.77.691-1.467 1.133-2.546.757-1.152 1.192-2.237 1.95-3.375l-.133-.638c1.258-1.907 3.282-3.316 5.504-3.778"/><path d="M6.534 34.127c.162 4.094 1.009 8.048 2.87 11.804 1.597 1.02 2.863 1.358 4.136 2.436a3 3 0 0 1-.648-.103c3.017 4.204 7.477 3.962 11.59 1.761.625-.47 2.95-.844 3.15-1.57-.074-.33-3.606-.308-5.439-.624-1.5-.396-2.995-.777-4.496-1.166-1.155-.455-2.045-1.306-3.2-1.76-1.56-.712-2.26-2.297-3.216-3.478-.552-.917-1.509-2.106-1.715-3.096-.42-1.981-.125-4.512.118-6.544.184-.697.375-1.401.56-2.098.507-.77.69-1.468 1.132-2.546.758-1.152 1.193-2.238 1.95-3.375l-.132-.638c1.258-1.908 3.282-3.316 5.504-3.778-6.74 1.07-12.877 8.048-12.149 14.782z"/><path d="M24.526 56.235c-1.508 0-2.965-.124-4.327-.381-3.296-.609-6.446-2.12-9.36-4.505-1-.814-1.98-1.731-2.899-2.721l.493-.646c.25.132.508.25.78.367.258.11.552.22.839.33.066.03.14.051.206.08a31 31 0 0 1-3.635-4.262l-.066-.154-.177-.873q-.057-.088-.103-.176l-.088-.154a16 16 0 0 1-1.634-2.355c-.368-.748-.699-1.416-1-2.09l-.037-.17c0-1.775.242-3.558.485-5.282.081-.594.162-1.174.228-1.731-.044-.367.192-.587.346-.734.066-.066.14-.125.199-.205.073-.294.096-.506.125-.741.03-.264.059-.536.162-.91l.03-.073c.706-1.482 1.478-2.656 2.222-3.8 2.796-3.742 6.6-6.192 11.317-7.315l1.604-.367.184.8-1.604.367c-4.525 1.07-8.168 3.418-10.824 6.97-.722 1.1-1.465 2.244-2.142 3.653-.073.3-.103.52-.132.763-.03.264-.06.543-.162.924l-.059.125c-.125.183-.258.308-.353.403-.037.037-.096.088-.11.11a29 29 0 0 1-.221 1.864c-.236 1.665-.479 3.39-.479 5.077.287.638.604 1.276.942 1.966.45.792.979 1.555 1.56 2.252.074.103.11.169.147.235s.074.125.118.19l.066.147.177.866c1.486 2.076 3.135 3.88 4.908 5.363l-.375.712c-.42-.11-.832-.235-1.251-.375-.206-.088-.405-.161-.603-.242.441.411.883.793 1.339 1.16 2.803 2.296 5.828 3.756 8.992 4.335 1.803.338 3.768.448 5.82.323a13.4 13.4 0 0 0 1.98-.69c.08-.036.125-.036.265-.044 1.626-.095 5.857-.63 9.905-3.528 1.405-1.321 2.766-3.074 4.025-5.187.699-1.453 1.442-2.986 1.825-4.41.47-2.222.75-4.254.964-6.998-.081-1.842-.611-4.3-1.355-6.214-.699-1.812-1.84-3.676-3.06-5.004a19 19 0 0 1-.869-1.012c-.905-1.093-1.759-2.12-2.936-2.326l-.5-.161.25-.785.456.147c1.42.242 2.406 1.438 3.37 2.597.273.33.552.667.84.983 1.302 1.416 2.479 3.33 3.222 5.26.773 1.988 1.325 4.556 1.406 6.522-.221 2.832-.508 4.893-.986 7.175-.413 1.526-1.17 3.089-1.899 4.607-1.31 2.209-2.723 4.02-4.224 5.43-4.26 3.059-8.675 3.616-10.375 3.719h-.044c-.611.271-1.318.513-2.083.719l-.08.014a28 28 0 0 1-1.737.052z"/><path d="M31.274 56.732c-3.422 1.276-6.41 1.65-7.506 1.738-.052 0 .03 0 0 0-.258-.014-.61-.03-.86 0l-.185-.146c-.493 0-1.089.05-1.626-.052-2.782-.455-5.048-1.166-7.52-2.392-.516-.293-.92-.212-1.325-.088 4.312 3.104 9.875 4.74 15.799 4.146 1.906-.294 3.878-.323 5.261-1.497-.066-.235-.132-.294.066-.609.258-.08.258-.264.523-.337-.479.132-.957.132-1.435.088 1.332-.345 2.583-1.013 3.856-1.556a19 19 0 0 1-5.048.705"/><path d="M49.486 23.85c-.383-.69-.728-1.137-1.111-1.827a9 9 0 0 0-.692.851c-1.074-4.218-4.18-6.91-8.418-8.436.75.829 1.442 1.716 2.038 2.655 1.067 1.115 2.031 2.304 2.87 3.683.14.066.272.132.302.235 2.73 4.321 4.51 9.126 4.165 14.511-.081.147-.155.294-.125.397-.052 1.503-.589 2.553-.89 3.345-.067.315-.118-.015-.221.477-2.443 7.035-6.38 10.946-10.177 13.103-5.43 3.088-10.582 2.619-10.663 2.64-.706.235-1.435.404-2.163.521-3.334.558-6.579.096-6.579.096 3.209 1.937 7.168 1.6 10.361.873-.184-.037-.368-.088-.56-.132.17 0 .354-.022.553-.051.14-.022.28.014.434.08.17-.037.324-.08.478-.117.022-.096-.007-.132-.338-.22a85 85 0 0 0 1.825-.184c2.045-.616 3.384-1.159 3.348-.8a16 16 0 0 1-1.06.456c4.07-.756 7.889-2.348 10.442-6.222.235-.3.743-.638 1.243-.99 7.418-6.39 9.75-16.947 4.93-24.951zM10.604 49.501c.375.162.75.294 1.126.426-1.67-1.754-3.098-3.808-4.276-5.987-.037-.337-.066-.675-.103-1.012-.073-.14-.125-.286-.191-.426a16 16 0 0 1-1.332-2.516c-.272-.77-.522-1.49-.75-2.201-.42-1.313-.766-2.604-1.009-4.167-.544-6.97.545-14.724 6.189-19.009 1.067-1.041 1.722-1.878 3.076-2.787.412-.191.691-.074 1.096-.272 1.067-1.034 2.163-1.306 3.105-2.017 2.414-1.167 4.85-1.776 7.381-2.047.11-.118.22-.242.316-.396-3.384-.162-6.791.704-10.125 2.127-.096.015-.184.132-.272.25-2.833 1.159-5.159 2.905-7.653 4.981-1.295 1.1-2.31 2.274-3.311 3.55-.633.918-1.354 1.85-1.892 2.965-.434 1.1-.97 2.017-1.317 3.11-.25.873-.412 1.629-.662 2.502 0 .11.368.33.368.44-1.133 6.001.493 11.82 3.657 16.448.368.536.037 1.042.456 1.548 1.207 1.32 2.4 2.407 3.827 3.294.235.147.47.287.72.426.494.264 1.075.514 1.568.778z"/><path d="M35.225 28.5c.7 1.18 1.965 3.08 2.635 4.181l.758.125c1.67 3.47 1.515 7.468.265 10.689-.368.917-.45 1.812-.98 2.67-1.235 1.996-2.648 3.808-4.62 5.305-1.2.91-2.84 1.709-4.092 2.37a902 902 0 0 1 4.644-1.35c4.452-2.084 7.822-6.369 8.499-10.946.353-.184.699-.367.956-.602.464-.844.596-1.585.729-2.326-.17-1.71.331-3.617.17-5.326-.678-4.086-3.312-7.256-6.212-9.897-.412-.381-1.17 3.551-1.589 3.192 0 0-.243 1.217-1.17 1.914z"/></svg>';
const rayolLogo = new Image();
rayolLogo.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(RAYOL_LOGO_SVG);

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

const pointers = new Map();
function touchDir() {
  const r = canvas.getBoundingClientRect();
  let dir = 0;
  for (const x of pointers.values()) dir += x - r.left < r.width / 2 ? -1 : 1;
  return Math.sign(dir);
}
canvas.addEventListener("pointerdown", e => { pointers.set(e.pointerId, e.clientX); e.preventDefault(); });
canvas.addEventListener("pointermove", e => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX); });
const releasePointer = e => { pointers.delete(e.pointerId); };
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("pointerleave", releasePointer);
restartBtn.addEventListener("click", reset);

function reset() {
  branches = [];
  score = 0;
  spawnTimer = 0;
  gardener.x = W / 2;
  running = true;
  restartBtn.style.display = "none";
  msgEl.textContent = "📱 Touche la moitié gauche/droite de l'écran pour bouger · ⌨️ ← → ou Q/D · Évite les branches ! 🌿";
}

function spawnBranch() {
  const len = 40 + Math.random() * 50;
  // Feuilles en faucille, alternes, retombantes : générées une fois par branche
  // pour que le graphisme reste stable d'une frame à l'autre.
  const n = 7 + Math.floor(Math.random() * 3);
  const leaves = [];
  for (let i = 0; i < n; i++) {
    leaves.push({
      t: 0.15 + 0.8 * (i / Math.max(1, n - 1)), // position le long de la branche
      side: i % 2 === 0 ? -1 : 1,               // feuillage alterne
      angle: 0.45 + Math.random() * 0.55,       // port retombant
      len: 17 + Math.random() * 9,
      curve: (Math.random() - 0.5) * 7,         // légère courbure en faucille
      tone: Math.floor(Math.random() * 4),
      tilt: (Math.random() - 0.5) * 0.35
    });
  }
  branches.push({
    x: 20 + Math.random() * (W - 40),
    y: -40,
    len,
    leaves,
    angle: Math.random() * Math.PI,
    spin: (Math.random() - 0.5) * 0.1,
    speed: 2.2 + Math.random() * 2.2 + Math.min(score / 300, 3)
  });
}

function update() {
  if (!running) return;
  gardener.dir = touchDir();
  if (keys["ArrowLeft"] || keys["q"] || keys["Q"]) gardener.dir -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) gardener.dir += 1;
  gardener.dir = Math.sign(gardener.dir);
  gardener.x = Math.max(gardener.w / 2, Math.min(W - gardener.w / 2, gardener.x + gardener.dir * gardener.speed));

  spawnTimer -= 1;
  if (spawnTimer <= 0) {
    spawnBranch();
    spawnTimer = Math.max(18, 60 - score / 20);
  }

  for (const b of branches) {
    b.y += b.speed;
    b.angle += b.spin;
    const dx = Math.abs(b.x - gardener.x);
    const dy = Math.abs(b.y - gardener.y + gardener.h / 2);
    if (dx < b.len / 2 + gardener.w / 2 - 6 && dy < 8 + gardener.h / 2 - 6) {
      running = false;
      if (score > best) {
        best = score;
        localStorage.setItem("jardinier-best", best);
        bestEl.textContent = best;
      }
      msgEl.textContent = "Aïe ! Une branche t'a cogné la tête 🤕 — Score final : " + score;
      restartBtn.style.display = "block";
    }
  }
  branches = branches.filter(b => b.y < H + 60);
  score += 1;
  scoreEl.textContent = score;
}

function drawGardener() {
  const { x, y, w, h } = gardener;
  ctx.save();
  ctx.translate(x, y);
  // jambes
  ctx.fillStyle = "#5d4037";
  ctx.fillRect(-w / 2 + 4, -10, 10, 12);
  ctx.fillRect(w / 2 - 14, -10, 10, 12);
  // corps (blouse de jardinage)
  ctx.fillStyle = "#7cb342";
  ctx.fillRect(-w / 2 + 2, -h + 18, w - 4, h - 30);
  // logo du Domaine du Rayol sur le t-shirt
  if (rayolLogo.complete && rayolLogo.naturalWidth > 0) {
    ctx.drawImage(rayolLogo, -6, -25, 12, 12.4);
  }
  // tête
  ctx.fillStyle = "#ffcc80";
  ctx.beginPath();
  ctx.arc(0, -h + 8, 11, 0, Math.PI * 2);
  ctx.fill();
  // chapeau de paille
  ctx.fillStyle = "#d4a95c";
  ctx.fillRect(-14, -h + 2, 28, 5);
  ctx.fillRect(-9, -h - 3, 18, 5);
  // yeux
  ctx.fillStyle = "#333";
  ctx.fillRect(-4, -h + 8, 2, 2);
  ctx.fillRect(2, -h + 8, 2, 2);
  // bras tendus (panique !)
  ctx.fillStyle = "#ffcc80";
  ctx.fillRect(-w / 2 - 6, -h + 24, 8, 4);
  ctx.fillRect(w / 2 - 2, -h + 24, 8, 4);
  ctx.restore();
}

// Une feuille d'eucalyptus : lame allongée en faucille, nervure centrale
// claire (effet pruine), pétiole court.
function drawEucalyptusLeaf(L, curve, tone) {
  const tones = ["#7d9c7f", "#8fac8e", "#6d8f74", "#9db69b"];
  const Wd = L * 0.22;
  // pétiole court
  ctx.strokeStyle = "#7a5c50";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(L * 0.14, curve * 0.2);
  ctx.stroke();
  // lame en faucille
  ctx.beginPath();
  ctx.moveTo(L * 0.12, curve * 0.2);
  ctx.quadraticCurveTo(L * 0.5, -Wd + curve * 0.4, L, curve);
  ctx.quadraticCurveTo(L * 0.5, Wd * 0.7 + curve * 0.4, L * 0.12, curve * 0.2);
  ctx.closePath();
  ctx.fillStyle = tones[tone % tones.length];
  ctx.fill();
  ctx.strokeStyle = "rgba(50,70,55,0.35)";
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // nervure centrale claire
  ctx.strokeStyle = "rgba(226,236,220,0.75)";
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(L * 0.16, curve * 0.25);
  ctx.quadraticCurveTo(L * 0.55, -Wd * 0.35 + curve * 0.45, L * 0.94, curve * 0.9);
  ctx.stroke();
}

function drawBranch(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  const half = b.len / 2;
  ctx.lineCap = "round";

  // bois interne brun rougeâtre (visible où l'écorce pèle)
  ctx.strokeStyle = "#8a5a44";
  ctx.lineWidth = 6.5;
  ctx.beginPath();
  ctx.moveTo(-half, 0);
  ctx.lineTo(half, 0);
  ctx.stroke();

  // écorce extérieure grisée, par plaques détachées
  ctx.strokeStyle = "#9e948d";
  ctx.lineWidth = 5;
  for (let i = 0; i < 4; i++) {
    const x0 = -half + b.len * (i * 0.22 + 0.05);
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(x0 + b.len * 0.14, 0);
    ctx.stroke();
  }

  // fibres longitudinales sombres
  ctx.strokeStyle = "rgba(62,39,35,0.55)";
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 5; i++) {
    const x = -half + b.len * (i * 0.19 + 0.06);
    ctx.beginPath();
    ctx.moveTo(x, -1.6);
    ctx.lineTo(x + b.len * 0.06, 1.4);
    ctx.stroke();
  }

  // feuilles alternes, retombantes, en faucille
  for (const lf of b.leaves) {
    ctx.save();
    ctx.translate(-half + b.len * lf.t, 0);
    ctx.rotate(lf.side * lf.angle + lf.tilt);
    drawEucalyptusLeaf(lf.len, lf.curve, lf.tone);
    ctx.restore();
  }
  ctx.restore();
}

function drawTouchHint() {
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  const y = GROUND + 34;
  ctx.beginPath();
  ctx.moveTo(30, y - 12); ctx.lineTo(30, y + 12); ctx.lineTo(48, y); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W - 30, y - 12); ctx.lineTo(W - 30, y + 12); ctx.lineTo(W - 48, y); ctx.closePath(); ctx.fill();
}

// Eucalyptus décoratif en fond : tronc à écorce qui pèle (plages brun
// rougeâtre sous une écorce grisée) et feuillage gris-vert discret.
function drawBackgroundEucalyptus(x, topY, w) {
  const h = GROUND + 10 - topY;
  ctx.fillStyle = "#9e948d";
  ctx.fillRect(x, topY, w, h);
  // stries verticales sombres
  ctx.fillStyle = "rgba(62,39,35,0.28)";
  ctx.fillRect(x + w * 0.3, topY, 1.5, h);
  ctx.fillRect(x + w * 0.62, topY + 8, 1.5, h - 8);
  // plaques d'écorce décollées laissant voir le brun rougeâtre
  ctx.fillStyle = "#8a5a44";
  for (let i = 0; i < 5; i++) {
    const py = topY + 18 + i * (h / 5.6);
    const px = x + (i % 2 === 0 ? -1 : w - 3);
    ctx.fillRect(px, py, 4, 12 + (i % 3) * 5);
  }
  // touffes de feuilles gris-vert en haut du tronc
  const tones = ["#7d9c7f", "#6d8f74", "#9db69b"];
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = tones[i % 3];
    ctx.beginPath();
    ctx.arc(x + w / 2 + Math.sin(i * 2.1) * 16, topY - 4 + (i % 3) * 7, 9 - (i % 2) * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // sol
  ctx.fillStyle = "#7cb342";
  ctx.fillRect(0, GROUND + 10, W, H - GROUND);
  // eucalyptus en fond
  drawBackgroundEucalyptus(30, 60, 14);
  drawBackgroundEucalyptus(W - 60, 90, 14);
  for (const b of branches) drawBranch(b);
  drawGardener();
  if (pointers.size > 0 || matchMedia("(pointer: coarse)").matches) drawTouchHint();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
